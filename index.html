<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Page inactive</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f5f6fa;
      color: #202332;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(100%, 480px);
      padding: 32px;
      border: 1px solid #e0e3ec;
      border-radius: 16px;
      background: #fff;
      text-align: center;
      box-shadow: 0 12px 40px rgba(32, 35, 50, .08);
    }
    h1 { margin: 0 0 10px; font-size: clamp(22px, 5vw, 30px); }
    p { margin: 0; color: #697084; line-height: 1.6; }
    @media (prefers-color-scheme: dark) {
      body { background: #11131a; color: #f5f6fa; }
      main { border-color: #303442; background: #1a1d26; box-shadow: none; }
      p { color: #aeb4c3; }
    }
  </style>
</head>
<body>
  <main>
    <h1>এই পেজটি বর্তমানে চালু নেই</h1>
    <p>ঠিকানাটি ভবিষ্যতের ব্যবহারের জন্য সংরক্ষিত আছে।</p>
  </main>
</body>
</html>
